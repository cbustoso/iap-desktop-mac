name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-lint-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true; swift --version
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
      - name: Build
        run: swift build -v
      - name: SwiftLint
        run: |
          brew install swiftlint || true
          swiftlint lint --strict
      - name: Test
        run: swift test
